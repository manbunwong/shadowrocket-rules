# 自定义扩展规则：Muse / ChatGPT / 国外服务域名走代理
#
# 用法（在 iPhone 的 Shadowrocket 里操作）：
#  1. 把本文件作为独立配置导入（配置 > 右上角 + > 粘贴配置链接 > 下载），
#     可重命名为「自定义规则」。
#  2. 点主配置 sr_top500_banlist_ad 的 ⓘ > 通用 > 包含配置，选择「自定义规则」。
#  3. 之后主配置随 update-url 刷新多少次，这份规则都不会被洗掉。
#     要加新域名时更新本文件即可（本文件不含 update-url，不会被远程覆盖）。
#
# 更新日期：2026-10-01

